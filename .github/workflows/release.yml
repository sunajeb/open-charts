name: release
# Builds the installers for a version tag (v1.2.3) and attaches them to a DRAFT GitHub release:
#   open-charts-<version>.pkg           Mac, per user (scripts/build-mac.ts)
#   open-charts-<version>.msi           Windows, per user (scripts/build-msi.ts)
#   open-charts-<version>-machine.msi   Windows, per machine for Intune
#   SHA256SUMS.txt
# Signed when the signing secrets exist (docs/release.md, "Signing"), unsigned otherwise; an
# unsigned release says so in its notes and must stay a draft: the update check (src/update.ts)
# only ever sees published releases. A beta tag (v1.2.3-beta.1: anything with a "-") is published
# at once as a PRE-RELEASE for test users, signed or not, with docs/BETA.md as its notes (install
# steps past the unsigned warnings); the update check never offers pre-releases.
# workflow_dispatch builds the same files without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    env:
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_INSTALLER_ID: ${{ secrets.APPLE_INSTALLER_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_CERTIFICATES_P12: ${{ secrets.APPLE_CERTIFICATES_P12 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Developer ID certificates into a temporary keychain
        if: env.APPLE_CERTIFICATES_P12 != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
      - run: npm ci
      - run: npm run build:mac
      - run: npm run check:mac-pkg
      - name: Signature and notarization
        if: env.APPLE_INSTALLER_ID != ''
        run: |
          pkgutil --check-signature dist/mac/open-charts-*.pkg
          spctl --assess --type install -vv dist/mac/open-charts-*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/mac/open-charts-*.pkg

  windows:
    runs-on: windows-latest
    env:
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:win
      - name: Sign open-charts.exe (Azure Trusted Signing)
        if: env.AZURE_TRUSTED_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\win
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - run: node --experimental-strip-types --no-warnings scripts/smoke-exe.ts dist/win/open-charts.exe
      - name: WiX Toolset
        shell: powershell
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.Util.wixext/5.0.2 WixToolset.UI.wixext/5.0.2
      - run: npm run build:msi
      - name: Sign the MSIs (Azure Trusted Signing)
        if: env.AZURE_TRUSTED_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\win
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Signatures
        if: env.AZURE_TRUSTED_SIGNING_ACCOUNT != ''
        shell: powershell
        run: |
          foreach ($f in Get-ChildItem dist\win\open-charts.exe, dist\win\*.msi) {
            $s = Get-AuthenticodeSignature $f.FullName
            if ($s.Status -ne 'Valid') { throw "$($f.Name): $($s.Status) $($s.StatusMessage)" }
            Write-Host "$($f.Name): signed by $($s.SignerCertificate.Subject)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/win/*.msi

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNED: ${{ secrets.APPLE_INSTALLER_ID != '' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/BETA.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Beta pre-release (published, for test users)
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --title "open-charts ${GITHUB_REF_NAME#v} (beta)" --notes-file ../docs/BETA.md *
      - name: Draft release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          notes="Installers for ${GITHUB_REF_NAME}. Mac: open-charts-*.pkg. Windows: open-charts-*.msi (per user), open-charts-*-machine.msi (IT)."
          if [ "$SIGNED" != "true" ]; then notes="UNSIGNED BUILD: do not publish (docs/release.md). $notes"; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "open-charts ${GITHUB_REF_NAME#v}" --notes "$notes" *
